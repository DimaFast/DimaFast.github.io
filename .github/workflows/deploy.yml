name: Deploy website
run-name: Deploy from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Repository secret ENV is missing or empty."
            exit 1
          fi

          umask 077
          printf '%s\n' "$ENV_FILE" > .env.production

      - name: Build website
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
