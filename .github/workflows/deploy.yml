name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build website
        run: npm run build
        env:
          SITE_INDEXABLE: "true"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4